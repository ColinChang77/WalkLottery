name: WalkLottery
options:
  bundleIdPrefix: tw.homework
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  WalkLottery:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tw.homework.WalkLottery
        INFOPLIST_KEY_CFBundleDisplayName: 散步靈感
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  WalkLotteryTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: WalkLottery
  WalkLotteryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: WalkLottery
schemes:
  WalkLottery:
    build:
      targets:
        WalkLottery: all
    test:
      targets: [WalkLotteryTests, WalkLotteryUITests]
